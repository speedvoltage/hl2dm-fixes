// Copy the desired settings to server.cfg.
sv_vote_enabled 1
sv_vote_kick 1
sv_vote_kick_matchmaking 1
sv_vote_cooldown 120
// Community servers: 1-30 minutes. Reserved matchmaking always uses 5 minutes.
sv_vote_kick_ban_minutes 5
// Community mapcycle: 3-second delay, 20-second ballot, 5-second result.
// Coordinator reservations retain their assigned map and lobby-return flow.
sv_vote_end_of_map 1
